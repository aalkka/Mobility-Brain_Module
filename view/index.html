<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 연결</title>
<!-- 폰 연결(PC 화면 · 사용자 11-17 초안 «짝짓기 B · 세 단계 줄») — 자료 = pair.py view · 단추 «QR 보이기» = 행위 mobility.pair(짝 코드는 누를 때만) · 폰에는 안 실림(module.json view.phone=false)
     11-18 «폰 연결 ui가 이상함»(본문 창 2000px): B 는 폭 420 으로 그린 안 → 넓은 창에서도 그 꼴로 = 기둥 폭 상한 420 · 가운데(옵션·홈 화면과 같은 방식) · 상자 없음(D5).
     원 색 = 자료 상태만(펼침은 아래 칸이 이미 보여 줌): 됨 초록 · 다음 할 차례·QR 기다림 보라 · 다시 찍기 노랑 · 그 밖 회색 — 다 붙은 뒤엔 셋 다 초록.
     11-18 데스크톱 따로(사용자 «모바일 꼴이라 이질감» → 2차 초안 «A» 고름 · 제작자 초안):
     PC(env.device=desktop · 안 넘기면 마우스 화면)에서만 A = 가운데 920 · 머리 «✓ PC 7/7»(덜 되면 그 수 + 빠진 것 펼침) · 왼쪽 붙은 기기 묶음 · 오른쪽 고정 300 «새 기기»(단추 → QR 240 → ✓ 방금 + 단추) · 760 아래 한 단.
     폰·탭 = 위 세 줄 꼴 그대로(draw 아래쪽). 동작·자료·행위는 둘이 같다.
     11-19 사용자 «모바일 연결로 이름 변경 · 같은 기기는 하나로 묶고 눌러서 펼침으로 앱, 옵시디언»: 붙은 기기 = 기기(이름)마다 한 줄(▸ 이름 · 앱·옵시디언 상태 한눈에)
     → 누르면 «앱»·«옵시디언» 줄(마지막 닿음·다시 찍기). 묶기는 화면에서만(pair.py 자료 그대로) · «이름 모름»은 서로 다른 기기일 수 있어 묶지 않는다. -->
<style>
:root{--bg:#fff;--bg2:#f6f6f6;--line:#e0e0e0;--tx:#222;--tx2:#6b6b6b;--tx3:#a0a0a0;--accent:#7c5cff;--warn:#c98a00;--err:#d33;--ok:#2a9d4b;--font:system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 var(--font)}
#app{max-width:420px;margin:0 auto}
.hd{display:flex;align-items:center;gap:6px;padding:10px 12px 8px;font-size:15px;font-weight:600}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.st{display:flex;align-items:center;gap:8px;min-height:30px;padding:0 12px;cursor:pointer;user-select:none}
.st .n{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;font-size:12px}
.st.is-done .n{border-color:var(--ok);color:var(--ok)}
.st.is-now .n{border-color:var(--accent);color:var(--accent)}
.st.is-warn .n{border-color:var(--warn);color:var(--warn)}
.st .sp{flex:1}.st .fl{color:var(--tx2)}
.body{padding:4px 12px 10px 38px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.btn{font:inherit;height:26px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);border-radius:4px;padding:0 10px;cursor:pointer}
.btn.cta{background:var(--accent);border-color:var(--accent);color:#fff}
.qr{width:168px;height:168px;border-radius:4px;display:block}
.qc{display:flex;align-items:center;gap:8px;color:var(--tx2)}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--tx);font-variant-numeric:tabular-nums;letter-spacing:.5px;user-select:all}
.row{align-self:stretch;display:flex;align-items:center;gap:8px;min-height:28px;padding:0 6px;border-radius:4px}
.row.is-new{background:var(--bg2)}
.row .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .fl{color:var(--tx2);white-space:nowrap}
.row .fl.warn,.warn{color:var(--warn)}
.dg{cursor:pointer;user-select:none}.dg .chv{display:flex;flex:none;color:var(--tx3)}
.row.dg{gap:6px;padding-left:2px}.row.dg .ic{width:14px;height:14px}
.row.dk-k{padding-left:42px}.dr.dk-k{padding-left:46px}
.dg .sm{white-space:nowrap}.bad{color:var(--err)}.dim{color:var(--tx3)}
/* 데스크톱 A — 글자 셋(15 제목 · 13 본문 · 12 곁 글) · 꼴은 brain-base 묶음(bb-tp-sec)·줄(bb-tp-row)과 같은 값 */
#app.is-desk{max-width:none}
.dk{max-width:920px;margin:0 auto;padding:18px 24px 40px;display:flex;flex-direction:column;gap:14px}
.dk .ic{width:14px;height:14px}
.dk-hd{display:flex;align-items:center;gap:10px;min-height:24px;padding:0 6px}
.dk-tt{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600}
.dk-tt .ic{width:16px;height:16px}
.dk-pc{display:inline-flex;align-items:center;gap:4px;color:var(--ok);font-variant-numeric:tabular-nums}
.dk-pc.is-warn{color:var(--warn);cursor:pointer;user-select:none}
.dk-cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:26px 32px;align-items:start}
.sec{min-width:0}
.sec-hd{display:flex;align-items:center;gap:6px;padding:0 6px 4px;font-weight:500}
.sec-ic{display:flex;flex:none;color:var(--tx2)}
.sec-n{margin-left:auto;font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums}
.sec-n.warn{color:var(--warn)}
.sec-bd{margin-left:12px;padding-left:4px;border-left:1px solid var(--line)}
.dk-pcl{margin-top:-6px}
.dr{display:flex;align-items:center;gap:6px;min-height:26px;padding:2px 6px;border-radius:4px}
.dr.is-new{background:var(--bg2)}
.dr-ic{display:flex;flex:none;color:var(--tx3)}
.dr-tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-tx.dim{color:var(--tx3)}.dr-tx.warn{color:var(--warn)}
.dr-fl{flex:none;font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap}
.dr-fl.warn{color:var(--warn)}
.qb{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:6px 6px 0 22px}
.qb .dr{align-self:stretch;padding-left:0}
.dk-qr{width:240px;height:240px;display:block}
.dk-qr svg{display:block;width:240px;height:240px}
.dk .chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;font-size:12px}
.got{align-self:stretch;display:flex;align-items:center;gap:6px;min-width:0}
.got .ok{display:flex;flex:none;color:var(--ok)}
.got .dr-tx{flex:0 1 auto}
@media (max-width:760px){.dk{padding:12px 10px 32px}.dk-cols{grid-template-columns:minmax(0,1fr);gap:22px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const send=m=>parent.postMessage(m,'*');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON={
  phone:'<svg class="ic" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>',
  tab:'<svg class="ic" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M11 18h2"/></svg>',
  x:'<svg class="ic bad" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  q:'<svg class="ic dim" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3 2.4c-.6.2-.5.8-.5 1.6M12 17h.01"/></svg>'
};
const S={d:null,open:null,busy:false,pcOpen:null,dev:{}};
// 붙은 기기 묶기 — 같은 이름 = 한 기기(앱·옵시디언 줄 둘) · 순서 = 가장 최근 닿은 기기부터(자료가 이미 최근 순) · «이름 모름»은 따로
const KORD={'앱':0,'옵시디언':1};
function groups(devs){const by=new Map(),out=[];
  devs.forEach((x,i)=>{const k=x.name==='이름 모름'?'?'+i:x.name;let g=by.get(k);
    if(!g){g={key:k,name:x.name,tab:x.tab,items:[]};by.set(k,g);out.push(g)}g.items.push(x)});
  for(const g of out){g.ago=(g.items.find(x=>!x.again)||{}).ago;                        // 가장 최근 닿은 것(다시 찍기 줄 빼고)
    g.items.sort((a,b)=>(KORD[a.kind]??9)-(KORD[b.kind]??9));g.new=g.items.some(x=>x.new)}
  return out}
// 접힌 줄 오른쪽 = 둘의 상태 한눈에: 다 됨 «앱 · 옵시디언 · 방금»(가장 최근) · 섞이면 «앱 방금 · 옵시디언 다시 찍기»(다시 찍을 것만 노랑) · 다 다시면 «앱 · 옵시디언 다시 찍기» 노랑
function sumOf(g){const ok=g.items.filter(x=>!x.again),bad=g.items.filter(x=>x.again).map(x=>esc(x.kind));
  if(!bad.length)return ok.map(x=>esc(x.kind)).join(' · ')+(g.ago?' · '+esc(g.ago):'');
  return ok.map(x=>esc(x.kind)+' '+esc(x.ago)).concat(`<span class="warn">${bad.join(' · ')} 다시 찍기</span>`).join(' · ')}
// 기기 가르기(로드맵 화면과 같은 법) — ① 부모가 넘긴 env.device(phone·tablet·desktop · 지금 brain-base 는 안 넘김)
// ② 손가락 화면(pointer:coarse·hover:none) = 폰·탭 · 마우스 = PC ③ 신호가 없으면 폭(600 이하 = 폰)
let DEV=null;
function devOf(){if(DEV)return DEV;const mm=q=>matchMedia(q).matches;if(window.matchMedia)return mm('(pointer:coarse)')&&mm('(hover:none)')?(Math.min(screen.width,screen.height)<600?'phone':'tablet'):'desktop';return innerWidth<=600?'phone':'desktop'}
// ── 데스크톱 A ── 아이콘 = 옵시디언 lucide 와 같은 꼴
const DI={
  phone:'<svg class="ic" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>',
  tab:'<svg class="ic" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M12 18h.01"/></svg>',
  link:'<svg class="ic" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
  qr:'<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="16" y="3" width="5" height="5" rx="1"/><rect x="3" y="16" width="5" height="5" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3M21 21v.01M12 7v3a2 2 0 0 1-2 2H7M3 12h.01M12 3h.01M12 16v.01M16 12h1M21 12v.01M12 21v-1"/></svg>',
  check:'<svg class="ic" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  x:'<svg class="ic bad" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  q:'<svg class="ic dim" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></svg>',
  down:'<svg class="ic" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  right:'<svg class="ic" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>'
};
function drawDesk(d){
  const pcOk=d.pc.ok===d.pc.n,showQr=d.qr&&!d.qr.used;
  const gs=groups(d.devices),devN=gs.length,again=d.devices.some(x=>x.again);
  const pcOpen=!pcOk&&(S.pcOpen??true);                       // 덜 되면 빠진 것을 펼쳐 둠(머리 수를 누르면 접음)
  let h='<div class="dk"><div class="dk-hd"><span class="dk-tt">'+DI.phone+'<span>모바일 연결</span></span>';
  h+=pcOk?`<span class="dk-pc">${DI.check}<span>PC ${d.pc.ok}/${d.pc.n}</span></span>`
         :`<span class="dk-pc is-warn" data-pc>${pcOpen?DI.down:DI.right}<span>PC ${d.pc.ok}/${d.pc.n}</span></span>`;
  h+='</div>';
  if(pcOpen)h+='<div class="sec-bd dk-pcl">'+d.pc.miss.map(x=>`<div class="dr">${DI.x}<span class="dr-tx">${esc(x)}</span></div>`).join('')
    +d.pc.unknown.map(x=>`<div class="dr">${DI.q}<span class="dr-tx">${esc(x)}</span></div>`).join('')+'</div>';
  h+='<div class="dk-cols"><div class="sec"><div class="sec-hd"><span class="sec-ic">'+DI.link+'</span><span>붙은 기기</span>'
    +`<span class="sec-n${again?' warn':''}">${devN}</span></div><div class="sec-bd">`;
  h+=devN?gs.map(g=>{const op=!!S.dev[g.key];
      return `<div class="dr dg${g.new?' is-new':''}" data-dev="${esc(g.key)}" title="${op?'접기':'펼치기'}"><span class="chv">${op?DI.down:DI.right}</span><span class="dr-ic">${g.tab?DI.tab:DI.phone}</span><span class="dr-tx">${esc(g.name)}</span><span class="dr-fl sm">${sumOf(g)}</span></div>`
        +(op?g.items.map(x=>`<div class="dr dk-k${x.new?' is-new':''}"><span class="dr-tx">${esc(x.kind)}</span><span class="dr-fl${x.again?' warn':''}">${x.again?'다시 찍기':esc(x.ago)}</span></div>`).join(''):'')}).join('')
    :'<div class="dr"><span class="dr-tx dim">없음</span></div>';
  h+='</div></div><div class="sec"><div class="sec-hd"><span class="sec-ic">'+DI.qr+'</span><span>새 기기</span></div><div class="qb">';
  if(showQr){
    h+=d.qr.svg?`<div class="dk-qr">${d.qr.svg}</div>`:`<div class="dr">${DI.x}<span class="dr-tx">주소 모름 — Tailscale</span></div>`;
    h+=`<div class="qc"><span class="chip">${esc(d.qr.short)}</span><span>${esc(d.qr.until)} · ${esc(d.qr.left)}번</span></div>`;
  }else{
    if(d.paired){const nw=d.devices.find(x=>x.new);
      h+=`<div class="got"><span class="ok">${DI.check}</span>`+(nw?`<span class="dr-tx">${esc(nw.name)}</span><span class="dr-fl">${esc(nw.kind)} · ${esc(d.paired)}</span>`:`<span class="dr-tx">${esc(d.paired)}</span>`)+'</div>';}
    if(d.wiped)h+=`<div class="dr">${DI.x}<span class="dr-tx warn">코드 무효 · 틀림 10번</span></div>`;
    h+=`<button class="btn cta" id="pair"${S.busy?' disabled':''}>QR 보이기</button>`;
  }
  document.getElementById('app').innerHTML=h+'</div></div></div></div>';
}
function stepOpen(d){
  if(S.open)return S.open;
  if(d.pc.ok<d.pc.n)return 1;
  if(d.qr&&!d.qr.used)return 2;
  if(d.paired)return 3;
  return 2;
}
function draw(){
  const d=S.d;if(!d)return;
  const desk=devOf()==='desktop';document.getElementById('app').classList.toggle('is-desk',desk);
  if(desk)return drawDesk(d);
  const open=stepOpen(d),pcOk=d.pc.ok===d.pc.n;
  const showQr=d.qr&&!d.qr.used;
  // 원 색 = 자료 상태(펼친 줄과 무관) — 됨 · 다음 할 차례(첫 안 된 줄) · ③ 다시 찍기 · 그 밖 회색
  const gs=groups(d.devices),devN=gs.length,again=d.devices.some(x=>x.again);
  const done=[pcOk,devN>0&&!showQr,devN>0&&!again],next=done.indexOf(false);
  const mark=i=>done[i]?'is-done':(i===2&&again?'is-warn':(i===next?'is-now':''));
  const st=(n,name,cls,fl)=>`<div class="st ${cls}" data-step="${n}"><span class="n">${n}</span><span class="nm">${name}</span><span class="sp"></span><span class="fl">${fl}</span></div>`;
  let h=`<div class="hd">${ICON.phone}<span>모바일 연결</span></div>`;
  h+=st(1,'PC 준비',mark(0),`${d.pc.ok}/${d.pc.n}`);
  if(open===1&&!pcOk){
    h+='<div class="body">'+d.pc.miss.map(x=>`<div class="row">${ICON.x}<span class="tx">${esc(x)}</span></div>`).join('')
      +d.pc.unknown.map(x=>`<div class="row">${ICON.q}<span class="tx">${esc(x)}</span></div>`).join('')+'</div>';
  }
  h+=st(2,'찍기',mark(1),!showQr&&d.paired?esc(d.paired):'');
  if(open===2){
    h+='<div class="body">';
    if(showQr){
      h+=d.qr.svg?`<div class="qr">${d.qr.svg}</div>`:'<div class="row">'+ICON.x+'<span class="tx">주소 모름 — Tailscale</span></div>';
      h+=`<div class="qc"><span class="chip">${esc(d.qr.short)}</span><span>${esc(d.qr.until)} · ${esc(d.qr.left)}번</span></div>`;
    }else{
      if(d.wiped)h+=`<div class="row">${ICON.x}<span class="tx warn">코드 무효 · 틀림 10번</span></div>`;
      h+=`<button class="btn cta" id="pair"${S.busy?' disabled':''}>QR 보이기</button>`;
    }
    h+='</div>';
  }
  h+=st(3,'붙은 기기',mark(2),again?`<span class="warn">${devN}</span>`:devN);
  if(open===3){
    h+='<div class="body">'+gs.map(g=>{const op=!!S.dev[g.key];
      return `<div class="row dg${g.new?' is-new':''}" data-dev="${esc(g.key)}"><span class="chv">${op?DI.down:DI.right}</span>${g.tab?ICON.tab:ICON.phone}<span class="tx">${esc(g.name)}</span><span class="fl sm">${sumOf(g)}</span></div>`
        +(op?g.items.map(x=>`<div class="row dk-k${x.new?' is-new':''}"><span class="tx">${esc(x.kind)}</span><span class="fl${x.again?' warn':''}">${x.again?'다시 찍기':esc(x.ago)}</span></div>`).join(''):'')}).join('')+'</div>';
  }
  document.getElementById('app').innerHTML=h;
  const qs=document.querySelector('.qr svg');if(qs){qs.setAttribute('width','168');qs.setAttribute('height','168')}
}
addEventListener('message',e=>{const m=e.data||{};
  if(m.t==='theme'){for(const[k,v]of Object.entries(m.vars||{}))if(v)document.documentElement.style.setProperty(k,v);draw()}
  else if(m.t==='data'&&m.data){const was=S.d;S.d=m.data;S.busy=false;
    if(was&&m.data.paired&&!was.paired)S.open=null;          // 방금 붙음 → 붙은 기기 줄로
    if(was&&m.data.qr&&!was.qr)S.open=null;                  // 코드가 생김 → 찍기 줄로
    draw()}
  else if(m.t==='env'&&m.device!==undefined&&(m.device||null)!==DEV){DEV=m.device||null;draw()}
});
document.addEventListener('click',e=>{
  const p=e.target.closest('#pair');
  if(p){S.busy=true;S.open=2;draw();send({t:'act',id:'mobility.pair'});return}
  const g=e.target.closest('[data-dev]');
  if(g){const k=g.dataset.dev;S.dev[k]=!S.dev[k];draw();return}
  if(e.target.closest('[data-pc]')){S.pcOpen=!(S.pcOpen??true);draw();return}
  const s=e.target.closest('[data-step]');
  if(s){const n=+s.dataset.step;S.open=stepOpen(S.d)===n&&n!==2?2:n;draw()}
});
send({t:'ready'});
</script>
</body>
</html>
